<!DOCTYPE html>
<html>
    <head>
        <title> Music Exchange Payment </title>
        <meta charset="utf-8">
        <link rel="icon" type="image/x-icon" href="../imgs/foodie.ico">
        <link rel="stylesheet" href="../css/style.css">
        <script src="../js/login.js" defer></script>
    </head>
    <body>
        <header>
            <a href="../html/index.html"><img id="logo" src="../imgs/logo.png"></a>
            <h1>Add Your Payment Details</h1>
            <a href="../html/index.html">Home </a>
        </header>
        <main>
        <p>Enter your payment details here.</p>

        <form method="post" action="/" id="payment_form">
            <label for="card_number_input">Card Number:</label>
            <input type="text" id="card_number_input" name="card_number_input">

            <label for="expiration_date_input">Expiration Date:</label>
            <input type="text" id="expiration_date_input" name="expiration_date_input">

            <label for="security_number_input">Security Number:</label>
            <input type="password" id="security_number_input" name="security_number_input">

            <button id="payment_btn" type="submit">Submit Payment Details</button>
        </form>
        </main>
    </body>
</html>
