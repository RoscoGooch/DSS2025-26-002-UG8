<!DOCTYPE html>
<html>

<head>
    <title> Music 'R' Us </title>
    <meta charset="utf-8">
    <link rel="icon" type="image/x-icon" href="../imgs/foodie.ico">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js"></script>
    <script src="../js/posts.js" defer></script>
    <script src="../js/main.js" defer></script>
</head>

<body>
    <header>
        <a href="../html/index.html"><img id="logo" src="../imgs/logo.png"></a>
        <h1>Music 'R' Us</h1>
        <div class="dropdown">
            <button id="login_link" href="#">Username <i class="fa fa-caret-down"></i></button>
            <div class="dropdown-content">
                <form action="/logout" method="POST">
                    <button id="logout_btn" type="submit">Log out</button>
                </form>
            </div>
        </div>
        <div class="session-timeout" hidden="true">
            <h3 id="timeout_display">Logout in 3 minutes</h3>
            <button id="login_cont">Stay logged in</button>
            <button id="login_stop" href="../html/login.html">Log out</button>
        </div>
    </header>

    <nav>
        <ul>
            <li><a href="../html/index.html">Home</a></li>
            <li class="active"><a href="../html/posts.html">Latest Posts</a></li>
            <li><a href="../html/my_posts.html">My Posts</a></li>
        </ul>
    </nav>

    <main>
        <section id="postsList">
            <h2>Latest Music Posts</h2>
            <p>See the latest posts from your fellow Music Lovers!</p>

            <i class="fa fa-search" aria-hidden="true"></i>
            <input class="search_bar" id="search" name="search" type="text" placeholder="Search posts...">
        </section>
    </main>
</body>

</html>
